name: Terraform (shared)

# PR into develop or main -> read-only plan
# push or workflow_dispatch -> apply to shared project

on:
  workflow_dispatch:
  pull_request:
    branches: [develop, main]
    paths:
      - "environments/shared/**"
      - "modules/cloud-sql/**"
      - ".github/workflows/terraform-shared.yml"
  push:
    branches: [develop, main]
    paths:
      - "environments/shared/**"
      - "modules/cloud-sql/**"
      - ".github/workflows/terraform-shared.yml"

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-shared
  cancel-in-progress: false

defaults:
  run:
    shell: bash
    working-directory: environments/shared

jobs:
  plan:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER_SHARED }}
          service_account: ${{ vars.GCP_TF_PLAN_SA_SHARED }}

      - run: terraform init -input=false -backend-config="bucket=${{ vars.GCP_PROJECT_ID_SHARED }}-tfstate" -backend-config="prefix=terraform/state"

      - run: terraform validate

      - name: Plan
        run: |
          terraform plan -no-color -input=false -var-file=terraform.tfvars -lock-timeout=5m | tee plan.txt
          {
            echo '### Terraform plan (shared)'
            echo '```'
            tail -c 60000 plan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  apply:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER_SHARED }}
          service_account: ${{ vars.GCP_TF_APPLY_SA_SHARED }}

      - run: terraform init -input=false -backend-config="bucket=${{ vars.GCP_PROJECT_ID_SHARED }}-tfstate" -backend-config="prefix=terraform/state"

      - run: terraform apply -auto-approve -input=false -var-file=terraform.tfvars -lock-timeout=10m
