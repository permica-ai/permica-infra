name: Terraform Destroy (dev)

on:
  workflow_dispatch:
    inputs:
      confirm_destroy:
        description: 'Type "DESTROY" to confirm tearing down the dev environment'
        required: true
        type: string

permissions:
  contents: read
  id-token: write

defaults:
  run:
    shell: bash
    working-directory: environments/dev

jobs:
  destroy:
    name: Destroy Dev Environment
    runs-on: ubuntu-latest
    if: inputs.confirm_destroy == 'DESTROY'
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER_DEV }}
          service_account: ${{ vars.GCP_TF_APPLY_SA_DEV }}

      - run: terraform init -input=false -backend-config="bucket=${{ vars.GCP_PROJECT_ID_DEV }}-tfstate" -backend-config="prefix=terraform/state"

      - name: Destroy
        run: terraform destroy -auto-approve -input=false -var-file=terraform.tfvars -lock-timeout=10m
